name: KIRA OS autonomous coding agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Конкретная задача для AI-программиста KIRA OS"
        required: true
        type: string
      base_branch:
        description: "Ветка, от которой создать отдельную ветку с изменениями"
        required: true
        default: "v46/kdrv-catalogue-signature-policy"
        type: string

concurrency:
  group: kira-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  copilot-requests: write

jobs:
  implement:
    name: Implement one requested KIRA OS task
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    steps:
      - name: Validate Copilot authentication
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$COPILOT_TOKEN" ]; then
            echo "::error::Add repository secret COPILOT_GITHUB_TOKEN with the Copilot Requests permission."
            exit 1
          fi

      - name: Check out the requested base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate base and create isolated work branch
        id: branch
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$BASE_BRANCH"
          git fetch origin "$BASE_BRANCH"
          git checkout -b "ai/kira-${RUN_ID}" "origin/$BASE_BRANCH"
          echo "name=ai/kira-${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Run the coding agent — code-writing phase only
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          KIRA_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/kira-agent-prompt.md" <<'PROMPT'
          You are the autonomous implementation engineer for KIRA OS.
          Follow the repository's AGENTS.md rules exactly.

          Work on the currently checked-out isolated branch. Implement the user's task below in real source code. First inspect relevant code, interfaces, callers, architecture notes, and build integration. Make the smallest complete implementation that satisfies the task. Do not add stubs, mocks, placeholders, fake success paths, or unrelated changes.

          PHASE BOUNDARY: do not run tests, builds, lint, audits, emulators, QEMU, ISO packaging, or release workflows. The owner explicitly wants the complete code-writing pass first and verification only after the agreed implementation scope is present. Do not claim verification passed. You may inspect source files and git diffs.

          Do not modify GitHub workflow files, secrets, signing keys, release artifacts, or data/mind_seed.bin. Do not commit, push, merge, or create a PR. The surrounding workflow publishes changes for review.

          If the task is too broad for one run, complete a coherent production-quality subset and clearly enumerate what remains. Never fabricate completion percentages.

          TASK:
          PROMPT
          printf '%s\n' "$KIRA_TASK" >> "$RUNNER_TEMP/kira-agent-prompt.md"
          copilot -p "$(cat "$RUNNER_TEMP/kira-agent-prompt.md")" -s --no-ask-user \
            --allow-tool='read, write, shell(git:*), shell(rg:*), shell(grep:*), shell(find:*), shell(sed:*), shell(cat:*), shell(head:*), shell(tail:*), shell(ls:*)' \
            | tee "$RUNNER_TEMP/kira-agent-output.txt"

      - name: Publish changes as a draft pull request
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          WORK_BRANCH: ${{ steps.branch.outputs.name }}
          TASK: ${{ inputs.task }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes were produced; no PR will be opened."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --name-only | grep -Eq '^(\.github/workflows/|keys/|data/mind_seed\.bin$)'; then
            echo "Protected path changed; refusing to publish this run."
            git diff --cached --name-only
            exit 1
          fi
          git config user.name "kira-os-agent"
          git config user.email "kira-os-agent@users.noreply.github.com"
          git commit -m "KIRA Agent: implement requested task"
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          TITLE="$(printf '%s' "$TASK" | head -c 70)"
          gh pr create --draft --repo "$REPOSITORY" --base "$BASE_BRANCH" --head "$WORK_BRANCH" \
            --title "KIRA Agent: $TITLE" \
            --body "$(printf '## Automated implementation\n\nTask:\n%s\n\nDraft PR created by the KIRA OS Copilot CLI workflow. Builds, tests, audits, emulators, QEMU, and packaging were intentionally not run during this code-writing phase. Review the diff, then run verification after the agreed code scope is complete.\n' "$TASK")"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Write run summary
        if: always()
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          WORK_BRANCH: ${{ steps.branch.outputs.name }}
          CHANGED: ${{ steps.publish.outputs.changed }}
        run: |
          {
            echo "## KIRA OS coding-agent run"
            echo "- Base branch: $BASE_BRANCH"
            echo "- Work branch: $WORK_BRANCH"
            echo "- Published changes: ${CHANGED:-unknown}"
            echo "- Verification: intentionally not run (code-writing phase)"
          } >> "$GITHUB_STEP_SUMMARY"
