name: KIRA OS autonomous coding agent

on:
  push:
    branches: [ai/kira-agent-bootstrap]
    paths: [AI_TASK.md]
  workflow_dispatch:
    inputs:
      task:
        description: "Конкретная задача для AI-программиста KIRA OS"
        required: false
        default: ""
        type: string
      base_branch:
        description: "Ветка, в которую должна быть основана работа агента"
        required: true
        default: "v46/kdrv-catalogue-signature-policy"
        type: string

concurrency:
  group: kira-agent-EXPR_WORKFLOW-EXPR-EXPR_REF-EXPR
  cancel-in-progress: false

jobs:
  agent:
    name: Copilot implementation pass
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      changed: ${{ steps.capture.outputs.changed }}
    steps:
      - name: Check out the selected source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name }} == 'workflow_dispatch' && ${{ inputs.base_branch }} || 'v46/kdrv-catalogue-signature-policy'
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the task text
        env:
          EVENT_NAME: ${{ github.event_name }}
          TASK_OVERRIDE: ${{ inputs.task }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$TASK_OVERRIDE" ]; then
              echo "A task is required for a manual run."
              exit 1
            fi
            printf '%s\n' "$TASK_OVERRIDE" > "$RUNNER_TEMP/kira-task.md"
          else
            cp AI_TASK.md "$RUNNER_TEMP/kira-task.md"
          fi

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Execute code-writing phase
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/kira-agent-prompt.md" <<'PROMPT'
          You are the autonomous implementation engineer for KIRA OS.
          Follow the repository AGENTS.md rules exactly.

          Implement the task text appended below in real source code. First inspect relevant source, headers, callers, architecture documentation, trust boundaries, and build integration. Make a complete and narrowly scoped implementation. Do not add stubs, mocks, placeholders, fake success paths, or unrelated changes.

          Do not run tests, builds, lint, audits, emulators, QEMU, ISO packaging, or release workflows. The owner explicitly requires the code-writing phase to finish before verification begins. Do not claim that any checks passed. You may inspect source files and git diffs.

          Do not modify GitHub workflow files, credentials, signing keys, release artifacts, or data/mind_seed.bin. Do not commit, push, merge, or create a pull request. The separate publishing job handles the patch.

          If the task is too broad for one run, complete a coherent production-quality part and list the exact remaining implementation. Never fabricate completion percentages.

          TASK:
          PROMPT
          cat "$RUNNER_TEMP/kira-task.md" >> "$RUNNER_TEMP/kira-agent-prompt.md"
          copilot -p "$(cat "$RUNNER_TEMP/kira-agent-prompt.md")" -s \
            --allow-tool='shell(git status:*)' \
            --allow-tool='shell(git diff:*)' \
            --allow-tool='shell(git log:*)' \
            --allow-tool='shell(git grep:*)' \
            --allow-tool='shell(git ls-files:*)' \
            --allow-tool='shell(git show:*)' \
            | tee "$RUNNER_TEMP/kira-agent-output.txt"

      - name: Capture the source patch
        id: capture
        run: |
          set -euo pipefail
          git add -N --all
          git diff --binary HEAD > "$RUNNER_TEMP/kira-agent.patch"
          if [ -s "$RUNNER_TEMP/kira-agent.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload implementation patch
        if: steps.capture.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kira-agent-patch
          path: ${{ runner.temp }}/kira-agent.patch
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish isolated implementation branch
    needs: agent
    if: needs.agent.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the selected source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name }} == 'workflow_dispatch' && ${{ inputs.base_branch }} || 'v46/kdrv-catalogue-signature-policy'
          fetch-depth: 0
          persist-credentials: false

      - name: Download the implementation patch
        uses: actions/download-artifact@v4
        with:
          name: kira-agent-patch
          path: ${{ runner.temp }}/kira-agent-patch

      - name: Apply, commit and push the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          WORK_BRANCH="ai/kira-$RUN_ID"
          git checkout -b "$WORK_BRANCH"
          git apply --index "$RUNNER_TEMP/kira-agent-patch/kira-agent.patch"
          if git diff --cached --name-only | grep -Eq '^(\.github/workflows/|keys/|data/mind_seed\.bin$)'; then
            echo "Protected path changed; refusing to publish."
            git diff --cached --name-only
            exit 1
          fi
          git config user.name "kira-os-agent"
          git config user.email "kira-os-agent@users.noreply.github.com"
          git commit -m "KIRA Agent: implement requested task"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
            push origin "HEAD:refs/heads/$WORK_BRANCH"
          {
            echo "## KIRA OS coding-agent run"
            echo "- Implementation branch: https://github.com/$GITHUB_REPOSITORY/tree/$WORK_BRANCH"
            echo "- Source branch: ${{ github.event_name }} == 'workflow_dispatch' && ${{ inputs.base_branch }} || 'v46/kdrv-catalogue-signature-policy'"
            echo "- Verification: intentionally not run (code-writing phase)"
            echo "- No pull request was opened, so this run does not trigger the repository PR test matrix."
          } >> "$GITHUB_STEP_SUMMARY"
