name: kira

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld nasm dosfstools mtools
      - name: host tests (models of devices, file systems, scheduler, mind)
        run: bash tests/run_host_tests.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools
      - name: build (clang, -Werror)
        run: ./build_clang.sh --no-run
      - uses: actions/upload-artifact@v4
        with:
          name: kira-image
          path: |
            kira.iso
            kira.disk
            kira.bin

  vm:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: [boot-virtio, boot-ata, boot-sata, boot-nvme, boot-1cpu, boot-8cpu, isolation, smp, usb-xhci, usb-uhci, stress-spam, stress-3d]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kira-image
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 dosfstools mtools python3-pil
      - name: scenario
        run: |
          ci/make_flash.sh
          python3 ci/kira_vm.py --scenario ${{ matrix.scenario }} --out ci-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-${{ matrix.scenario }}
          path: ci-out/${{ matrix.scenario }}
