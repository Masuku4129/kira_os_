name: kira

on:
  push:
    paths-ignore: ['docs/**', '**.md']        # только документы - стенд не нужен
  pull_request:
  workflow_dispatch:

concurrency:
  group: kira-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: lint (заглушки в новых строках)
        if: github.ref_name != 'main' && github.ref_name != 'stable'
        run: |
          git fetch -q origin stable main || true
          ci/lint.sh
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld nasm dosfstools mtools python3-cryptography python3-pil ca-certificates openssl
      - name: host tests (models of devices, file systems, scheduler, mind)
        run: |
          mkdir -p ci-out
          set -o pipefail
          bash tests/run_host_tests.sh 2>&1 | tee ci-out/host-tests.log
          python3 -m unittest discover -s tests -p 'test_source_intake.py' -v 2>&1 | tee ci-out/source-intake-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-host-tests
          path: |
            ci-out/host-tests.log
            ci-out/source-intake-tests.log

  data-formats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: data format benchmark
        run: |
          set -euo pipefail
          mkdir -p ci-out
          python3 benchmarks/data_formats.py --rows 50000 --repeat 5 --out ci-out/data-format-lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-data-formats
          path: ci-out/data-format-lab

  storage-pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: combined storage and update pipeline
        run: |
          set -euo pipefail
          mkdir -p ci-out
          python3 research/combined_lab/round2_pipeline_lab.py --rows 20000 --versions 8 --repeat 7 --out ci-out/round2-pipeline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-storage-pipeline
          path: ci-out/round2-pipeline

  compiler-bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: KCC versus Clang benchmark
        run: |
          set -euo pipefail
          mkdir -p ci-out
          KIRA_BENCH_RUNS=20 bash tests/kcc/bench/bench.sh 2>&1 | tee ci-out/kcc-bench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-compiler
          path: ci-out/kcc-bench.txt

  ipc-lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: process-shared IPC benchmark and integrity checks
        run: |
          set -euo pipefail
          mkdir -p ci-out
          gcc -O2 -std=c11 -Wall -Wextra -Werror -o ci-out/ipc-process-lab research/combined_lab/ipc_process_shared.c
          ci-out/ipc-process-lab 2>&1 | tee ci-out/ipc-process-lab.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-ipc
          path: ci-out/ipc-process-lab.txt

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools
      - name: build (clang, -Werror)
        run: |
          ./build_clang.sh --no-run
          mkdir -p sym && nm -n kira.bin > sym/kira.sym
      - uses: actions/upload-artifact@v4
        with:
          name: vm-symbols
          path: sym/kira.sym
      - uses: actions/upload-artifact@v4
        with:
          name: kira-image
          path: |
            kira.iso
            kira.disk
            kira.bin

  arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm qemu-system-arm dosfstools mtools python3-pil python3-cryptography ca-certificates openssl
      - name: build ARM64 (clang, -Werror)
        run: ./build_arm64.sh && ci/make_flash.sh
      - name: "scenarios (QEMU virt - GICv2/GICv3, 1-8 cores, EL1/EL2, exception vectors)"
        run: |
          set -o pipefail
          python3 ci/arm64_vm.py ci-out/arm64 2>&1 | tee arm64.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-arm64
          path: ci-out/arm64

  vm:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: [boot-virtio, boot-ata, boot-sata, boot-nvme, boot-1cpu, boot-8cpu, soak-8cpu, isolation, smp, usb-xhci, usb-uhci, stress-spam, stress-spam-2, stress-spam-4, stress-3d, limbo-spam, limbo-mttcg, net-e1000, sound-hda, apps-edit, apps-explorer2, apps-view, net-virtio, apps-wasm, wasm-speed, power-off, power-reboot, crash-isolation, net-e1000e, sound-ac97, net-ipv6, sound-sb16, mind-levers, mind-seed, cc-native, drv-edu, drvget-rl, drvman-edu, apps-drvman]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kira-image
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 dosfstools mtools python3-pil python3-cryptography openssl
      - name: kfstool (test files on the VM disk)
        run: gcc -O1 -Wall -DKFS_NO_THREADS -I. -Iarch/x86_64 -o tools/kfstool tools/kfstool.c kfs.c store.c sha256.c
      - name: mindseed (испытательное семя для сценария mind-seed - не результат обучения)
        run: |
          mkdir -p ci-out
          gcc -O1 -Wall -DKIRA_HOST_TEST -I. -Iarch/x86_64 -o tools/mindseed tools/mindseed.c mind.c mindnet.c
          tools/mindseed --fixture ci-out/mind_seed_fixture.bin
      - name: scenario
        run: |
          ci/make_flash.sh
          python3 ci/kira_vm.py --scenario ${{ matrix.scenario }} --out ci-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-${{ matrix.scenario }}
          path: |
            ci-out/${{ matrix.scenario }}
            !ci-out/${{ matrix.scenario }}/*.img


  artifact-audit:
    if: always()
    needs: [host-tests, data-formats, storage-pipeline, compiler-bench, ipc-lab, build, arm64, vm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vm-*
          path: results
      - name: Validate every VM result artifact
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("results")
          x86 = sorted(root.glob("vm-*/result.json"))
          arm64 = sorted((root / "vm-arm64").glob("**/result.json"))
          errors = []
          if len(x86) != 39:
              errors.append(f"x86-64: expected 39 result files, found {len(x86)}")
          if len(arm64) != 16:
              errors.append(f"ARM64: expected 16 result files, found {len(arm64)}")
          for path in x86 + arm64:
              try:
                  result = json.loads(path.read_text())
              except Exception as exc:
                  errors.append(f"{path}: invalid JSON: {exc}")
                  continue
              if result.get("ok") is not True:
                  errors.append(f"{path}: FAIL {result.get('name')}: {result.get('error')}")
          if errors:
              print("ARTIFACT AUDIT: FAIL")
              print("\n".join(errors))
              sys.exit(1)
          print(f"ARTIFACT AUDIT: PASS — {len(x86)} x86-64 and {len(arm64)} ARM64 result files")
          PY


  global-gate:
    if: always()
    needs: [host-tests, data-formats, storage-pipeline, compiler-bench, ipc-lab, build, arm64, vm, artifact-audit]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce whole-system CI gates
        env:
          HOST: ${{ needs.host-tests.result }}
          DATA_FORMATS: ${{ needs.data-formats.result }}
          STORAGE: ${{ needs.storage-pipeline.result }}
          COMPILER: ${{ needs.compiler-bench.result }}
          IPC: ${{ needs.ipc-lab.result }}
          BUILD: ${{ needs.build.result }}
          ARM64: ${{ needs.arm64.result }}
          VM: ${{ needs.vm.result }}
          AUDIT: ${{ needs.artifact-audit.result }}
        run: |
          printf 'Host tests: %s\nData formats: %s\nStorage pipeline: %s\nCompiler: %s\nIPC: %s\nBuild: %s\nARM64: %s\nQEMU matrix: %s\nArtifact audit: %s\n' "$HOST" "$DATA_FORMATS" "$STORAGE" "$COMPILER" "$IPC" "$BUILD" "$ARM64" "$VM" "$AUDIT"
          failed=0
          for result in "$HOST" "$DATA_FORMATS" "$STORAGE" "$COMPILER" "$IPC" "$BUILD" "$ARM64" "$VM" "$AUDIT"; do
            [ "$result" = success ] || failed=1
          done
          [ "$failed" -eq 0 ] || { echo "GLOBAL GATE: FAIL"; exit 1; }
          echo "GLOBAL GATE: PASS (all required CI jobs succeeded)"

  # Итоги - в ветку ci-results (одна свежая копия): журналы и снимки читаются через git, без хранилища артефактов.
  report:
    needs: [host-tests, data-formats, storage-pipeline, compiler-bench, ipc-lab, build, vm, arm64, global-gate]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vm-*
          path: results
      - name: publish to ci-results
        run: |
          set -e
          mkdir pub && cd pub
          B=ci-results; case "$GITHUB_REF_NAME" in main|stable) ;; *) B="ci-results-$(echo "$GITHUB_REF_NAME" | tr '/' '-')";; esac
          git init -q -b "$B"
          git config user.name "kira-ci"; git config user.email "ci@kira.invalid"
          mkdir latest
          cp -r ../results/* latest/ 2>/dev/null || true
          find latest -name '*.ppm' -delete
          {
            echo "# Прогон ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
            echo
            echo "host-tests: ${{ needs.host-tests.result }}"
            echo "data-formats: ${{ needs.data-formats.result }}"
            echo "storage-pipeline: ${{ needs.storage-pipeline.result }}"
            echo "compiler-bench: ${{ needs.compiler-bench.result }}"
            echo "ipc-lab: ${{ needs.ipc-lab.result }}"
            echo "build: ${{ needs.build.result }}"
            echo "vm matrix: ${{ needs.vm.result }}"
            echo "arm64: ${{ needs.arm64.result }}"
            echo "global gate: ${{ needs.global-gate.result }}"
            echo
            for r in latest/vm-*/result.json latest/vm-arm64/*/result.json; do
              python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print(('OK  ' if r['ok'] else 'FAIL'), r['name'], r.get('seconds'), 'с', '' if r['ok'] else '- ' + (r.get('error') or '').splitlines()[0][:300])" "$r" || true
            done
          } > latest/SUMMARY.md
          echo "${GITHUB_SHA}" > latest/SHA
          git add -A
          git commit -q -m "ci: ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$B"
