      - uses: actions/download-artifact@v4
        with:
          name: kira-uefi-ovmf
          path: ci-out/uefi-ovmf
      - uses: actions/download-artifact@v4
        with:
          name: kira-mind-quality
          path: ci-out/results/mind-quality
      - uses: actions/download-artifact@v4
        with:
          name: kira-gui-regression
          path: ci-out/results/gui-regression
      - uses: actions/download-artifact@v4
        with:
          name: kira-kcc-tests
