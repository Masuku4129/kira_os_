name: kira

concurrency:
  group: kira-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: repository inventory, shell/Python syntax and architecture gaps
        run: python3 ci/audit_inventory.py --out ci-out/audit
      - name: dependency, linker and source-provenance audit
        run: python3 ci/dependency_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kira-audit
          path: ci-out/audit/

  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: lint (new lines)
        run: |
          git fetch -q origin stable main || true
          ci/lint.sh
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld nasm dosfstools mtools python3-cryptography python3-pil ca-certificates openssl
      - name: host tests (models of devices, file systems, scheduler, mind)
        run: |
          mkdir -p ci-out
          set -o pipefail
          bash tests/run_host_tests.sh 2>&1 | tee ci-out/host-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-host-tests
          path: ci-out/host-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kira-gui-preview
          path: /tmp/kira_gfx/**/*.ppm
          if-no-files-found: warn

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools
      - name: build (clang, -Werror)
        run: |
          ./build_clang.sh --no-run
          mkdir -p sym && nm -n kira.bin > sym/kira.sym
      - uses: actions/upload-artifact@v4
        with:
          name: vm-symbols
          path: sym/kira.sym
      - uses: actions/upload-artifact@v4
        with:
          name: kira-image
          path: |
            kira.iso
            kira.disk
            kira.bin

  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm qemu-system-arm dosfstools mtools python3-pil python3-cryptography ca-certificates openssl
      - name: build ARM64 (clang, -Werror)
        run: ./build_arm64.sh && ci/make_flash.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kira-arm64-image
          path: |
            kira-arm64.img
            kira-arm64.disk
          if-no-files-found: ignore
      - name: "scenarios (QEMU virt - GICv2/GICv3, 1-8 cores, EL1/EL2, exception vectors)"
        run: |
          set -o pipefail
          python3 ci/arm64_vm.py ci-out/arm64 2>&1 | tee arm64.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-arm64
          path: ci-out/arm64

  vm:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [boot-virtio, boot-ata, boot-sata, boot-nvme, boot-1cpu, boot-8cpu, soak-8cpu, isolation, smp, usb-xhci, usb-uhci, stress-spam, stress-spam-2, stress-spam-4, stress-3d, limbo-spam, limbo-mttcg, net-e1000, sound-hda, apps-edit, apps-explorer2, apps-view, net-virtio, apps-wasm, wasm-speed, power-off, power-reboot, crash-isolation, net-e1000e, sound-ac97, net-ipv6, sound-sb16, mind-levers, mind-seed, cc-native, drv-edu, drvget-rl, drvman-edu, apps-drvman]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kira-image
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 dosfstools mtools python3-pil python3-cryptography openssl
      - name: kfstool (test files on the VM disk)
        run: gcc -O1 -Wall -DKFS_NO_THREADS -I. -Iarch/x86_64 -o tools/kfstool tools/kfstool.c kfs.c store.c sha256.c
      - name: mindseed (испытательное семя для сценария mind-seed - не результат обучения)
        run: |
          mkdir -p ci-out
          gcc -O1 -Wall -DKIRA_HOST_TEST -I. -Iarch/x86_64 -o tools/mindseed tools/mindseed.c mind.c mindnet.c
          tools/mindseed --fixture ci-out/mind_seed_fixture.bin
      - name: scenario
        run: |
          ci/make_flash.sh
          python3 ci/kira_vm.py --scenario ${{ matrix.scenario }} --out ci-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-${{ matrix.scenario }}
          path: |
            ci-out/${{ matrix.scenario }}
            !ci-out/${{ matrix.scenario }}/*.img

  report:
    needs: [audit, host-tests, build, vm, arm64]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          pattern: vm-*
          path: results
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: kira-audit
          path: results/audit
      - name: publish to ci-results
        if: github.event_name != 'pull_request'
        run: |
          set -e
          mkdir pub && cd pub
          B=ci-results; case "$GITHUB_REF_NAME" in main|stable) ;; *) B="ci-results-$(echo "$GITHUB_REF_NAME" | tr '/' '-')";; esac
          git init -q -b "$B"
          git config user.name "kira-ci"; git config user.email "ci@kira.invalid"
          mkdir latest
          cp -r ../results/* latest/ 2>/dev/null || true
          find latest -name '*.ppm' -delete
          {
            echo "# Прогон ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
            echo
            echo "audit: ${{ needs.audit.result }}, host-tests: ${{ needs.host-tests.result }}, build: ${{ needs.build.result }}, vm: ${{ needs.vm.result }}, arm64: ${{ needs.arm64.result }}"
            echo
            for r in latest/vm-*/result.json latest/vm-arm64/*/result.json; do
              python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print(('OK  ' if r['ok'] else 'FAIL'), r['name'], r.get('seconds'), 'с', '' if r['ok'] else '- ' + (r.get('error') or '').splitlines()[0][:300])" "$r" || true
            done
          } > latest/SUMMARY.md
          echo "${GITHUB_SHA}" > latest/SHA
          git add -A
          git commit -q -m "ci: ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$B"

  package:
    needs: [audit, host-tests, build, vm, arm64]
    if: success() && github.event_name != 'pull_request' && github.ref_name != 'main' && github.ref_name != 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          pattern: vm-*
          path: ci-out/results
      - uses: actions/download-artifact@v4
        with:
          name: kira-audit
          path: ci-out/audit
      - name: create installable source update
        env:
          HOST_RESULT: ${{ needs.host-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VM_RESULT: ${{ needs.vm.result }}
          ARM64_RESULT: ${{ needs.arm64.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash ci/package_update.sh origin/main ci-out/package
      - uses: actions/upload-artifact@v4
        with:
          name: kira-os-update-${{ github.sha }}
          path: |
            ci-out/package/KIRA_OS_Update.tar.gz
            ci-out/package/KIRA_OS_Update.tar.gz.sha256
