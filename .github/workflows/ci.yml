name: kira

# A branch with an open PR is verified by pull_request, not by a duplicate push
# run. New commits supersede older runs for the same PR/branch.
concurrency:
  group: kira-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main, stable]
    paths-ignore: ['docs/**', '**.md']        # только документы - стенд не нужен
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: lint (заглушки в новых строках)
        if: github.ref_name != 'main' && github.ref_name != 'stable'
        run: |
          git fetch -q origin stable main || true
          ci/lint.sh
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld nasm dosfstools mtools python3-cryptography python3-pil ca-certificates openssl
      - name: host tests (models of devices, file systems, scheduler, mind)
        run: |
          mkdir -p ci-out
          set -o pipefail
          bash tests/run_host_tests.sh 2>&1 | tee ci-out/host-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-host-tests
          path: ci-out/host-tests.log

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools
      - name: build (clang, -Werror)
        run: |
          ./build_clang.sh --no-run
          mkdir -p sym && nm -n kira.bin > sym/kira.sym
      - uses: actions/upload-artifact@v4
        with:
          name: vm-symbols
          path: sym/kira.sym
      - uses: actions/upload-artifact@v4
        with:
          name: kira-image
          path: |
            kira.iso
            kira.disk
            kira.bin

  arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm qemu-system-arm dosfstools mtools python3-pil python3-cryptography ca-certificates openssl
      - name: build ARM64 (clang, -Werror)
        run: ./build_arm64.sh && ci/make_flash.sh
      - name: "scenarios (QEMU virt - GICv2/GICv3, 1-8 cores, EL1/EL2, exception vectors)"
        run: |
          set -o pipefail
          python3 ci/arm64_vm.py ci-out/arm64 2>&1 | tee arm64.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kira-arm64-image
          path: |
            kira-arm64.img
            kira-arm64.elf
            kira-arm64.disk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-arm64
          path: ci-out/arm64

  vm:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: [boot-virtio, boot-ata, boot-sata, boot-nvme, boot-1cpu, boot-8cpu, soak-8cpu, isolation, smp, usb-xhci, usb-uhci, stress-spam, stress-spam-2, stress-spam-4, stress-3d, limbo-spam, limbo-mttcg, net-e1000, sound-hda, apps-edit, apps-explorer2, apps-view, net-virtio, apps-wasm, wasm-speed, power-off, power-reboot, crash-isolation, net-e1000e, sound-ac97, net-ipv6, sound-sb16, mind-levers, mind-seed, cc-native, drv-edu, drvget-rl, drvman-edu, apps-drvman]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kira-image
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 dosfstools mtools python3-pil python3-cryptography openssl
      - name: kfstool (test files on the VM disk)
        run: gcc -O1 -Wall -DKFS_NO_THREADS -I. -Iarch/x86_64 -o tools/kfstool tools/kfstool.c kfs.c store.c sha256.c
      - name: mindseed (испытательное семя для сценария mind-seed - не результат обучения)
        run: |
          mkdir -p ci-out
          gcc -O1 -Wall -DKIRA_HOST_TEST -I. -Iarch/x86_64 -o tools/mindseed tools/mindseed.c mind.c mindnet.c
          tools/mindseed --fixture ci-out/mind_seed_fixture.bin
      - name: scenario
        run: |
          ci/make_flash.sh
          python3 ci/kira_vm.py --scenario ${{ matrix.scenario }} --out ci-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-${{ matrix.scenario }}
          path: |
            ci-out/${{ matrix.scenario }}
            !ci-out/${{ matrix.scenario }}/*.img

  # Итоги - в ветку ci-results (одна свежая копия): журналы и снимки читаются через git, без хранилища артефактов.
  report:
    needs: [host-tests, build, vm, arm64]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vm-*
          path: results
      - name: publish to ci-results
        run: |
          set -e
          mkdir pub && cd pub
          B=ci-results; case "$GITHUB_REF_NAME" in main|stable) ;; *) B="ci-results-$(echo "$GITHUB_REF_NAME" | tr '/' '-')";; esac
          git init -q -b "$B"
          git config user.name "kira-ci"; git config user.email "ci@kira.invalid"
          mkdir latest
          cp -r ../results/* latest/ 2>/dev/null || true
          find latest -name '*.ppm' -delete
          {
            echo "# Прогон ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
            echo
            echo "host-tests: ${{ needs.host-tests.result }}, build: ${{ needs.build.result }}, vm: ${{ needs.vm.result }}, arm64: ${{ needs.arm64.result }}"
            echo
            for r in latest/vm-*/result.json latest/vm-arm64/*/result.json; do
              python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print(('OK  ' if r['ok'] else 'FAIL'), r['name'], r.get('seconds'), 'с', '' if r['ok'] else '- ' + (r.get('error') or '').splitlines()[0][:300])" "$r" || true
            done
          } > latest/SUMMARY.md
          echo "${GITHUB_SHA}" > latest/SHA
          git add -A
          git commit -q -m "ci: ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$B"

  # Full system bundle is published only when every validation gate is green.
  release-bundle:
    name: Full OS images (x86-64 + ARM64)
    needs: [host-tests, build, vm, arm64]
    if: ${{ needs.host-tests.result == 'success' && needs.build.result == 'success' && needs.vm.result == 'success' && needs.arm64.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kira-image
          path: input/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: kira-arm64-image
          path: input/arm64
      - name: Assemble full system images and checksums
        run: |
          set -euo pipefail
          mkdir -p dist/full/x86_64 dist/full/arm64
          test -s input/x86_64/kira.iso
          test -s input/x86_64/kira.disk
          test -s input/x86_64/kira.bin
          test -s input/arm64/kira-arm64.img
          test -s input/arm64/kira-arm64.disk
          test -s input/arm64/kira-arm64.elf
          install -m 0644 input/x86_64/kira.iso dist/full/x86_64/kira.iso
          install -m 0644 input/x86_64/kira.disk dist/full/x86_64/kira_disk.img
          install -m 0644 input/x86_64/kira.bin dist/full/x86_64/kira.bin
          install -m 0644 input/arm64/kira-arm64.img dist/full/arm64/kira-arm64.img
          install -m 0644 input/arm64/kira-arm64.disk dist/full/arm64/kira-arm64.disk
          install -m 0644 input/arm64/kira-arm64.elf dist/full/arm64/kira-arm64.elf
          cat > dist/full/README-RU.txt <<EOF
          KIRA OS — полный комплект системных образов
          Commit: ${GITHUB_SHA}

          x86-64:
            kira.iso       — загрузочный ISO (BIOS/UEFI при наличии соответствующих GRUB-модулей)
            kira_disk.img  — системный диск KiraFS; подключать как Hard Disk A
            kira.bin       — ядро для диагностики

          ARM64:
            kira-arm64.img  — загрузочный образ для QEMU virt/ARM64 (это не ISO)
            kira-arm64.disk — системный диск KiraFS
            kira-arm64.elf  — ELF с символами для диагностики

          Limbo x86: подключить x86_64/kira.iso как CD-ROM,
          x86_64/kira_disk.img как Hard Disk A, загрузка с CD-ROM.
          ARM64 image предназначен для QEMU virt; физическая совместимость с платами не заявляется.

          Комплект публикуется только после успешных host, x86-64, ARM64 и всех VM matrix проверок.
          EOF
          (cd dist/full && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          mkdir -p dist/out
          (cd dist && zip -X -qr "out/KIRA-OS-full-${GITHUB_SHA::12}.zip" full)
          unzip -t "dist/out/KIRA-OS-full-${GITHUB_SHA::12}.zip" >/dev/null
          (cd dist/out && sha256sum "KIRA-OS-full-${GITHUB_SHA::12}.zip" > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: kira-os-full-${{ github.sha }}
          path: dist/out/*
          if-no-files-found: error
          retention-days: 30
