      - uses: actions/download-artifact@v4
        with:
          name: kira-driver-e2e
          path: ci-out/results/driver-e2e
      - name: create installable unified update
        env:
          HOST_RESULT: ${{ needs.host-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VM_RESULT: ${{ needs.vm.result }}
          ARM64_RESULT: ${{ needs.arm64.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          MIND_RESULT: ${{ needs.mind-quality.result }}
          GUI_RESULT: ${{ needs.gui-regression.result }}
          KCC_RESULT: ${{ needs.kcc-tests.result }}
          DRIVER_RESULT: ${{ needs.driver-e2e.result }}
          UEFI_RESULT: ${{ needs.uefi-ovmf.result }}
          IMAGE_AUDIT_RESULT: ${{ needs.build.result }}
          IMAGE_AUDIT_DIR: ci-out/release-image-audit
          RELEASE_IMAGE_DIR: ci-out/release-image
          ARM64_IMAGE_DIR: ci-out/arm64-image
          KIRA_VERSION: v46
          KIRA_BASE_REF: edae4ab3367a055826f431e261af5d6dee790ddf
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash ci/package_update.sh origin/main ci-out/package
      - uses: actions/upload-artifact@v4
        with:
          name: kira-os-update-${{ github.sha }}
          path: |
            ci-out/package/KIRA_OS_Update.tar.gz
            ci-out/package/KIRA_OS_Update.tar.gz.sha256

