name: kira

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld nasm dosfstools mtools
      - name: host tests (models of devices, file systems, scheduler, mind)
        run: |
          mkdir -p ci-out
          set -o pipefail
          bash tests/run_host_tests.sh 2>&1 | tee ci-out/host-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-host-tests
          path: ci-out/host-tests.log

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools
      - name: build (clang, -Werror)
        run: |
          ./build_clang.sh --no-run
          mkdir -p sym && nm -n kira.bin > sym/kira.sym
      - uses: actions/upload-artifact@v4
        with:
          name: vm-symbols
          path: sym/kira.sym
      - uses: actions/upload-artifact@v4
        with:
          name: kira-image
          path: |
            kira.iso
            kira.disk
            kira.bin

  vm:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: [boot-virtio, boot-ata, boot-sata, boot-nvme, boot-1cpu, boot-8cpu, soak-8cpu, isolation, smp, usb-xhci, usb-uhci, stress-spam, stress-3d]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kira-image
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 dosfstools mtools python3-pil
      - name: scenario
        run: |
          ci/make_flash.sh
          python3 ci/kira_vm.py --scenario ${{ matrix.scenario }} --out ci-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-${{ matrix.scenario }}
          path: |
            ci-out/${{ matrix.scenario }}
            !ci-out/${{ matrix.scenario }}/*.img

  # Итоги - в ветку ci-results (одна свежая копия): журналы и снимки читаются через git, без хранилища артефактов.
  report:
    needs: [host-tests, build, vm]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vm-*
          path: results
      - name: publish to ci-results
        run: |
          set -e
          mkdir pub && cd pub
          git init -q -b ci-results
          git config user.name "kira-ci"; git config user.email "ci@kira.invalid"
          mkdir latest
          cp -r ../results/* latest/ 2>/dev/null || true
          find latest -name '*.ppm' -delete
          {
            echo "# Прогон ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
            echo
            echo "host-tests: ${{ needs.host-tests.result }}, build: ${{ needs.build.result }}, vm: ${{ needs.vm.result }}"
            echo
            for r in latest/vm-*/result.json; do
              python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print(('OK  ' if r['ok'] else 'FAIL'), r['name'], r.get('seconds'), 'с', '' if r['ok'] else '- ' + (r.get('error') or '').splitlines()[0][:300])" "$r" || true
            done
          } > latest/SUMMARY.md
          echo "${GITHUB_SHA}" > latest/SHA
          git add -A
          git commit -q -m "ci: ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
