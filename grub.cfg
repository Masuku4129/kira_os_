set timeout=4
set default=0

insmod all_video
insmod efi_gop
insmod efi_uga
insmod vbe
insmod vga
insmod gfxterm
# Меню GRUB - латиницей: у загрузчика нет кириллического шрифта.
# Режим экрана выбирается пунктом меню; если монитор/эмулятор не даёт режима, GRUB берёт следующий из списка.
# Ядро понимает 32, 24, 16 и 15 бит на пиксель.
set gfxmode=1280x720x32,1280x720,1024x768x32,1024x768,auto

menuentry "Kira OS 1280x720" {
    set gfxpayload=1280x720x32,1280x720,1280x800x32,1280x768x32,1366x768x32,1280x1024x32,1024x768x32,1024x768,auto
    multiboot2 /boot/kira.bin
    boot
}

menuentry "Kira OS 1920x1080 (external monitor, sharpest)" {
    set gfxpayload=1920x1080x32,1920x1080,1600x900x32,1600x900,1280x720x32,1280x720,auto
    multiboot2 /boot/kira.bin
    boot
}

menuentry "Kira OS 1600x900" {
    set gfxpayload=1600x900x32,1600x900,1366x768x32,1280x720x32,1280x720,auto
    multiboot2 /boot/kira.bin
    boot
}

menuentry "Kira OS 1024x768 (slow emulator, fewest pixels)" {
    set gfxpayload=1024x768x32,1024x768,auto
    multiboot2 /boot/kira.bin
    boot
}

menuentry "Kira OS 1280x720 + x2APIC (modern PCs: interrupt controller in MSR mode)" {
    set gfxpayload=1280x720x32,1280x720,1024x768x32,1024x768,auto
    multiboot2 /boot/kira.bin x2apic
    boot
}
